# =========================================
# Senemali API - Configuration Application
# Angular Web + Flutter Mobile
# =========================================

spring.application.name=senemali-api

# =========================================
# Base de données MySQL
# =========================================
spring.datasource.url=jdbc:mysql://mysql-senemali-abdoulazizc867-4ca9.d.aivencloud.com:14361/defaultdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Bamako
spring.datasource.username=${AIVEN_DB_USERNAME}
spring.datasource.password=${AIVEN_DB_PASSWORD}

#spring.datasource.url=jdbc:mysql://localhost:3306/senemali?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Bamako
#spring.datasource.username=root
#spring.datasource.password=ad648258
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================
# JWT Configuration
# =========================================
jwt.secret=SenemaliSecretKey2026TresLongueEtSecurisee
jwt.expiration=86400000
# Refresh token: 7 jours
jwt.refresh-expiration=604800000

# =========================================
# Upload de fichiers (images produits, profils)
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Dossier de stockage des fichiers uploadés
app.upload.dir=uploads
app.upload.max-size=10485760
app.upload.max-video-size=104857600

# Stockage distant des fichiers (laisser local pour le développement local)
app.storage.provider=${APP_STORAGE_PROVIDER:local}
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:senemali-uploads}

# URL de base pour servir les fichiers statiques
#app.base-url=http://localhost:8080
app.base-url=https://senemali-production.onrender.com

# =========================================
# Springdoc OpenAPI / Swagger
# =========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# =========================================
# Logging
# =========================================
logging.level.com.senemali=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================================
# CORS - Angular (4200) + Flutter Web (4300)
# =========================================
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300,http://localhost:3000

# =========================================
# Serveur
# =========================================
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
